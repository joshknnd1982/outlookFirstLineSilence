name = "outlookFirstLineSilence"
summary = "Outlook First Line Silence"
description = """Suppresses NVDA's automatic Outlook message-entry speech, including the inspector title, dialog/document container speech, and first line. Says the title of a message window you come back to, such as with Alt+Tab, and of a Forward, Reply or new message window, as JAWS does. Announces when focus reaches an editable message body. Plays sounds when Outlook's suggested-recipient list appears and goes away while you address a message. Reconnects NVDA to Outlook when that connection stops answering, so messages in the message list keep their status, such as unread or replied. Opens the stories in newsletters that Outlook shows without their links, and shows a message as a plain web page on request (NVDA+Shift+X). Recognizes classic Outlook, new Outlook, and older Windows Mail/Calendar variants. Derived specifically from verified Mute Browse Mode 3.6.57 behavior."""
author = "Dennis Long <dennisl@fastmail.com>; based on Mute Browse Mode 3.6.57 by Josh Kennedy"
version = "1.0.29"
changelog = "Says the title of a message window you write in, as JAWS does. With 1.0.28, Control+F on a message said only ‘To edit blank’, then ‘multi line’: the add-on kept the Forward window’s title quiet, as it does when you open a message to read it. JAWS says the title, then ‘To Edit’. Now Forward, Reply, Reply All and New say their window’s title, then the field or message body you land in. Opening a message you read is still quiet. To, Cc, Bcc and Subject no longer say ‘blank’ when you land on them empty, or ‘multi line’ just after, which JAWS doesn’t say either; moving in an empty field still says ‘blank’."
url = "https://github.com/joshknnd1982/outlookFirstLineSilence"
minimumNVDAVersion = "2026.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
