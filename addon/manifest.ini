name = "outlookFirstLineSilence"
summary = "Outlook First Line Silence"
description = """Suppresses NVDA's automatic Outlook message-entry speech, including the inspector title, dialog/document container speech, and first line. Announces when focus reaches an editable message body. Plays sounds when Outlook's suggested-recipient list appears and goes away while you address a message. Reconnects NVDA to Outlook when that connection stops answering, so messages in the message list keep their status, such as unread or replied. Opens the stories in newsletters that Outlook shows without their links, and shows a message as a plain web page on request (NVDA+Shift+V). Recognizes classic Outlook, new Outlook, and older Windows Mail/Calendar variants. Derived specifically from verified Mute Browse Mode 3.6.57 behavior."""
author = "Dennis Long <dennisl@fastmail.com>; based on Mute Browse Mode 3.6.57 by Josh Kennedy"
version = "1.0.25"
changelog = "Opens stories that Outlook shows without their links. Some newsletters put one link around a whole story: its picture, headline, summary and 'Read more'. Outlook can’t show a link like that, so the story was plain text, and Enter on its headline did nothing. Now Enter or Space on text in a classic Outlook message finds that text in the message’s own HTML and opens the link the sender put around it in your web browser. Links Outlook does show open as before. Reformats a message on request. Press NVDA+Shift+V while reading a message, or with a message selected in the message list, and the add-on shows it as a plain web page in your browser: its subject as a heading, then its headings, paragraphs, lists and links, without layout tables, pictures or the sender’s styles. Every line of a story is a link to it. Nothing on the page is loaded from the internet, so opening it doesn’t tell the sender you read the message. The page is a temporary file that is replaced each time and removed when NVDA exits. You can change the gesture in NVDA’s Input Gestures dialog, under Outlook First Line Silence."
url = "https://github.com/joshknnd1982/outlookFirstLineSilence"
minimumNVDAVersion = "2026.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
