name = "outlookFirstLineSilence"
summary = "Outlook First Line Silence"
description = """Suppresses NVDA's automatic Outlook message-entry speech, including the inspector title, dialog/document container speech, and first line. Announces when focus reaches an editable message body. Plays sounds when Outlook's suggested-recipient list appears and goes away while you address a message. Reconnects NVDA to Outlook when that connection stops answering, so messages in the message list keep their status, such as unread or replied. Recognizes classic Outlook, new Outlook, and older Windows Mail/Calendar variants. Derived specifically from verified Mute Browse Mode 3.6.57 behavior."""
author = "Dennis Long <dennisl@fastmail.com>; based on Mute Browse Mode 3.6.57 by Josh Kennedy"
version = "1.0.23"
changelog = "Fixes messages in Outlook's message list being announced without their status (unread, replied or forwarded, has attachment, importance) until NVDA was restarted. NVDA gets that status from Outlook's object model and keeps its connection to it for as long as Outlook runs, so when that connection stopped answering, as it did for a tester right after installing 1.0.22, every message lost its status for the rest of the session. The add-on now notices this when you move to a message and has NVDA connect to Outlook again before the message is announced, so the status comes back without restarting NVDA."
url = "https://github.com/joshknnd1982/outlookFirstLineSilence"
minimumNVDAVersion = "2026.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
