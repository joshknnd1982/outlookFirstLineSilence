name = "outlookFirstLineSilence"
summary = "Outlook First Line Silence"
description = """Suppresses NVDA's automatic Outlook message-entry speech, including the inspector title, dialog/document container speech, and first line. Announces when focus reaches an editable message body. Plays sounds when Outlook's suggested-recipient list appears and goes away while you address a message. Reconnects NVDA to Outlook when that connection stops answering, so messages in the message list keep their status, such as unread or replied. Opens the stories in newsletters that Outlook shows without their links, and shows a message as a plain web page on request (NVDA+Shift+V). Recognizes classic Outlook, new Outlook, and older Windows Mail/Calendar variants. Derived specifically from verified Mute Browse Mode 3.6.57 behavior."""
author = "Dennis Long <dennisl@fastmail.com>; based on Mute Browse Mode 3.6.57 by Josh Kennedy"
version = "1.0.26"
changelog = "Stops 'unread' being said twice when you delete a message. As Outlook deletes a message, or moves it out of the folder, it empties the message’s row before it moves to the next message, and NVDA said what was left of the row, just its status, such as 'unread', before the next message. The add-on now keeps that leftover status quiet, so you hear only the next message. It also no longer looks for Outlook’s Save/Keep-draft prompt in other programs, such as in Notepad’s Save As dialog."
url = "https://github.com/joshknnd1982/outlookFirstLineSilence"
minimumNVDAVersion = "2026.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
