name = "outlookFirstLineSilence"
summary = "Outlook First Line Silence"
description = """Suppresses NVDA's automatic Outlook message-entry speech, including the inspector title, dialog/document container speech, and first line. Says the title of a message window you come back to, such as with Alt+Tab, as JAWS does. Announces when focus reaches an editable message body. Plays sounds when Outlook's suggested-recipient list appears and goes away while you address a message. Reconnects NVDA to Outlook when that connection stops answering, so messages in the message list keep their status, such as unread or replied. Opens the stories in newsletters that Outlook shows without their links, and shows a message as a plain web page on request (NVDA+Shift+X). Recognizes classic Outlook, new Outlook, and older Windows Mail/Calendar variants. Derived specifically from verified Mute Browse Mode 3.6.57 behavior."""
author = "Dennis Long <dennisl@fastmail.com>; based on Mute Browse Mode 3.6.57 by Josh Kennedy"
version = "1.0.28"
changelog = "Says the whole title of an Outlook message window when you come back to it, as JAWS does. With 1.0.27, Alt+Tab back into an open message said only the start of its title: the Alt+Tab list began to say it, NVDA stopped speaking as the message came to the front, and the add-on then kept the message window’s own title quiet, as it does when a message opens. Now only opening a message is quiet. Coming back to one that is already open, with Alt+Tab, the taskbar, or when a reply or dialog in front of it closes, says its title, but still not ‘dialog’, ‘document’ or the first line."
url = "https://github.com/joshknnd1982/outlookFirstLineSilence"
minimumNVDAVersion = "2026.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
