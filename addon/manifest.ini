name = "outlookFirstLineSilence"
summary = "Outlook First Line Silence"
description = """Suppresses NVDA's automatic Outlook message-entry speech, including the inspector title, dialog/document container speech, and first line. Says the title of a message window you come back to, such as with Alt+Tab, and of a Forward, Reply or new message window, as JAWS does. Says ‘edit’ when focus lands in the body of a message you write, as JAWS does, or, if you choose, ‘You are now in the message body, type a message.’ Plays sounds when Outlook's suggested-recipient list appears and goes away while you address a message. Reconnects NVDA to Outlook when that connection stops answering, so messages in the message list keep their status, such as unread or replied. Opens the stories in newsletters that Outlook shows without their links, and shows a message as a plain web page on request (NVDA+Shift+X). Recognizes classic Outlook, new Outlook, and older Windows Mail/Calendar variants. Derived specifically from verified Mute Browse Mode 3.6.57 behavior."""
author = "Dennis Long <dennisl@fastmail.com>; based on Mute Browse Mode 3.6.57 by Josh Kennedy"
version = "1.0.30"
changelog = "Says ‘edit’ when you land in the body of a message you write, as JAWS does. With 1.0.29, Reply said its window’s title, then ‘You are now in the message body, type a message.’ JAWS says the title, then ‘edit’. The sentence is now a choice: in NVDA’s Settings, select Outlook First Line Silence, and set ‘When you land in the body of a message you write, say’ to ‘You are now in the message body, type a message’. The window’s title comes first either way."
url = "https://github.com/joshknnd1982/outlookFirstLineSilence"
minimumNVDAVersion = "2026.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
