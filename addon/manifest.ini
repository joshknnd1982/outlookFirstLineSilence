name = "outlookFirstLineSilence"
summary = "Outlook First Line Silence"
description = """Suppresses NVDA's automatic Outlook message-entry speech, including the inspector title, dialog/document container speech, and first line. Announces when focus reaches an editable message body. Plays sounds when Outlook's suggested-recipient list appears and goes away while you address a message. Reconnects NVDA to Outlook when that connection stops answering, so messages in the message list keep their status, such as unread or replied. Opens the stories in newsletters that Outlook shows without their links, and shows a message as a plain web page on request (NVDA+Shift+X). Recognizes classic Outlook, new Outlook, and older Windows Mail/Calendar variants. Derived specifically from verified Mute Browse Mode 3.6.57 behavior."""
author = "Dennis Long <dennisl@fastmail.com>; based on Mute Browse Mode 3.6.57 by Josh Kennedy"
version = "1.0.27"
changelog = "Moves the command that reformats a message to NVDA+Shift+X. NVDA+Shift+V, its key in 1.0.25 and 1.0.26, is also used by the Vision Assistant and Say Product Name and Version add-ons, so with either one installed NVDA+Shift+V could run the other add-on’s command instead. NVDA itself doesn’t use NVDA+Shift+X, and the add-on only takes the key in Outlook. In Input Gestures the command is now called ‘Reformats the Outlook message you are reading or have selected’, and the add-on’s help lists its keyboard commands."
url = "https://github.com/joshknnd1982/outlookFirstLineSilence"
minimumNVDAVersion = "2026.1.0"
lastTestedNVDAVersion = "2026.1.1"
docFileName = "readme.html"
